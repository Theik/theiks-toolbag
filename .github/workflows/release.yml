name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build release assets
        run: npm run release:build -- --tag "$GITHUB_REF_NAME"

      - name: Publish GitHub release
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/theiks-toolbag.zip
          dist/module.json
          --generate-notes
          --title "Theik's Toolbag $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
